[package]
name = "boop_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boop = { path = "../boop" }
boop_ai = { path = "../boop_ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.106"
getrandom = { version = "0.3", features = ["wasm_js"] }
