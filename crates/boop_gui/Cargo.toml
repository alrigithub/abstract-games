[package]
name = "boop_gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bevy GUI for Boop (human vs AI)."
repository = "https://github.com/alrigithub/abstract-games"

[dependencies]
abstract_gui_theme = { path = "../abstract_gui_theme" }
boop = { path = "../boop" }
boop_ai = { path = "../boop_ai" }

bevy = { version = "0.17" }
bevy_tweening = "0.14"
bevy_async_task = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[[bin]]
name = "boop"
path = "src/main.rs"
