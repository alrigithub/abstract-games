[package]
name = "tzaar_gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bevy GUI for Tzaar (human vs AI)."
repository = "https://github.com/alrigithub/abstract-games"

[dependencies]
abstract_gui_theme = { path = "../abstract_gui_theme" }
tzaar = { path = "../tzaar" }
tzaar_ai = { path = "../tzaar_ai" }

bevy = { version = "0.17" }
bevy_async_task = "0.11"

[[bin]]
name = "tzaar"
path = "src/main.rs"
