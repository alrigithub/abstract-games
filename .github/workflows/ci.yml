name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  web-3d:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-3d
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-3d/package-lock.json

      - name: Install, test, build, e2e
        run: |
          npm ci
          npm test
          npm run build
          npx playwright test
