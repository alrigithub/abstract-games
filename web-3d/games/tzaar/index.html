<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tzaar pieces demo</title>
    <style>
      .stack-height-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      .stack-height {
        position: absolute; transform: translate(-50%, -50%); z-index: 3;
        min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px;
        font: 700 10px/14px ui-sans-serif, system-ui, sans-serif; text-align: center;
        pointer-events: none; border: 1px solid #111; box-sizing: border-box;
        background: #f5f5f5; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,0.28);
      }
      #tzaar-toast {
        position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
        z-index: 30; padding: 8px 16px; border-radius: 8px;
        background: rgba(20, 20, 20, 0.9); color: #fff;
        font: 650 14px/1.3 system-ui, sans-serif;
        letter-spacing: 0.01em; pointer-events: none;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      }
      #tzaar-toast[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-buttons-mount"></div>
      <div id="tzaar-toast" data-testid="tzaar-toast" hidden></div>
      <div class="viewport">
        <div id="board" data-testid="board" aria-label="Tzaar board"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
