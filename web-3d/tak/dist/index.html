<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tak 3D</title>
    <script type="module" crossorigin src="./assets/index-DuoJI7D5.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-CtxdsHeN.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DsOOVDaw.css">
  </head>
  <body>
    <div id="app">
      <div id="game-buttons-mount"></div>
      <nav class="corner-controls" aria-label="View controls">
        <button class="icon-button" id="menu-toggle" data-testid="menu-toggle" aria-label="Menu" title="Menu">☰</button>
      </nav>
      <dialog id="menu" class="sandbox-menu" data-testid="main-menu">
        <div class="sandbox-menu-header"><h1>Tak</h1></div>
        <div class="menu-choices">
          <button class="menu-choice" data-testid="mode-sandbox">Sandbox</button>
          <button class="menu-choice" data-testid="mode-ai">Play vs AI</button>
        </div>
        <label class="delay-control">Board size
          <select id="size" data-testid="board-size">
            <option value="5" selected>5 × 5</option>
            <option value="4">4 × 4</option>
            <option value="6">6 × 6</option>
          </select>
        </label>
      </dialog>
      <main>
        <section class="play-area" aria-label="Tak board">
          <div class="board-wrap">
            <div id="board" data-testid="board" aria-label="Tak board"></div>
          </div>
        </section>
        <div id="selection-info" hidden data-testid="selection-info"><span class="hold-ring" id="hold-ring"></span><span id="selection-label">1</span></div>
        <div id="piece-actions" hidden>
          <button id="rotate" class="piece-action" data-testid="rotate-piece" aria-label="Flip stone">↕</button>
          <button id="done" class="piece-action" aria-label="Done">✓</button>
        </div>
        <nav class="board-actions">
          <button id="camera-mode" data-testid="camera-mode">Pan</button>
          <button id="undo" data-testid="undo" disabled>Undo</button>
          <button id="end-turn" data-testid="end-turn">End turn</button>
        </nav>
        <nav class="reset-actions"><button class="icon-button" id="reset" data-testid="reset">↺</button></nav>
      </main>
    </div>
  </body>
</html>
