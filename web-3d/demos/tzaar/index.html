<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tzaar pieces demo</title>
    <style>
      html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      .viewport, #board { width: 100%; height: 100%; touch-action: none; }
      #board { position: relative; }
      .stack-height {
        position: absolute; transform: translate(-50%, -100%);
        min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px;
        font: 700 10px/14px ui-sans-serif, system-ui, sans-serif; text-align: center;
        pointer-events: none; border: 1px solid #111; box-sizing: border-box;
        background: #f5f5f5; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,0.28);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-buttons-mount"></div>
      <div class="viewport">
        <div id="board" data-testid="board" aria-label="Tzaar board"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
