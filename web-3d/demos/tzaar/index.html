<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tzaar pieces demo</title>
    <style>
      html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #board { width: 100%; height: 100%; touch-action: none; position: relative; }
      .stack-height {
        position: absolute; transform: translate(-50%, -100%);
        min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px;
        font: 700 10px/14px ui-sans-serif, system-ui, sans-serif; text-align: center;
        pointer-events: none; border: 1px solid #111; box-sizing: border-box;
        background: #f5f5f5; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,0.28);
      }
      .corner-controls { position: fixed; top: 12px; right: 12px; z-index: 2; }
      .icon-button {
        width: 36px; height: 36px; border-radius: 8px; border: 1px solid #5c564c;
        background: #e8e4dc; color: #16171a; cursor: pointer; font-size: 18px;
      }
      [data-theme='dark'] .icon-button { background: #22242a; color: #f5f5f5; border-color: #8a8f98; }
    </style>
  </head>
  <body>
    <div id="app">
      <nav class="corner-controls" aria-label="View controls">
        <button class="icon-button" id="theme-toggle" data-testid="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
      </nav>
      <div id="board" data-testid="board"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
