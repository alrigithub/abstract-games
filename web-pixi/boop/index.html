<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boop (Pixi)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f3f1ec;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      .status {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgb(243 241 236 / 92%);
        border: 1px solid #5c564c;
        padding: 6px 14px;
        font-size: 14px;
        color: #111111;
        pointer-events: none;
      }
      a.back {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 11;
        color: #5c564c;
        font-size: 13px;
      }
      .hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        background: #f3f1ec;
        border: 1px solid #5c564c;
        padding: 10px 12px;
        color: #111111;
        font-size: 13px;
        box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 200px;
      }
      .hud label {
        opacity: 0.75;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hud button {
        font: inherit;
        font-size: 13px;
        border: 1px solid #5c564c;
        background: #e8e4dc;
        color: #111111;
        padding: 8px 12px;
        cursor: pointer;
      }
      .hud button:hover {
        background: #ddd8cf;
      }
      .hud button.active {
        background: #111111;
        color: #f5f5f5;
        border-color: #111111;
      }
      .hint {
        font-size: 11px;
        opacity: 0.65;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <a class="back" href="../index.html">← Abstract Games</a>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="hud">
      <label>Place piece (C toggles)</label>
      <div class="row">
        <button type="button" id="piece-kitten" class="active">Kitten</button>
        <button type="button" id="piece-cat">Cat</button>
        <button type="button" id="new-game">New game</button>
      </div>
      <p class="hint">Tap bed to place · Scroll zoom · Trackpad pan</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
