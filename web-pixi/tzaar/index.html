<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tzaar (Pixi)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f3f1ec;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        background: #f3f1ec;
        border: 1px solid #5c564c;
        padding: 10px 12px;
        color: #111111;
        font-size: 13px;
        line-height: 1.35;
        min-width: 160px;
        box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
      }
      .hud label {
        display: block;
        opacity: 0.75;
        margin-bottom: 6px;
      }
      .hud .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hud button {
        height: 36px;
        font-size: 14px;
        border: 1px solid #5c564c;
        background: #e8e4dc;
        color: #111111;
        cursor: pointer;
        padding: 0 10px;
      }
      .hud button:hover {
        background: #ddd8cf;
      }
      .hud button.ai-step {
        width: 40px;
        font-size: 20px;
        padding: 0;
      }
      .hud .depth {
        font-size: 22px;
        min-width: 36px;
        text-align: center;
      }
      .hud .pass {
        margin-top: 10px;
        width: 100%;
      }
      .hud .pass[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .legend {
        margin-top: 8px;
        font-size: 11px;
        opacity: 0.8;
        line-height: 1.3;
      }
      .status {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgb(243 241 236 / 92%);
        border: 1px solid #5c564c;
        padding: 6px 14px;
        font-size: 14px;
        color: #111111;
        pointer-events: none;
      }
      a.back {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 11;
        color: #5c564c;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <a class="back" href="../index.html">← Abstract Games</a>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="hud" id="ai-strength">
      <label for="ai-depth">AI strength (search depth)</label>
      <div class="row">
        <button type="button" class="ai-step" id="ai-dec" aria-label="Decrease AI strength">−</button>
        <span class="depth" id="ai-depth">10</span>
        <button type="button" class="ai-step" id="ai-inc" aria-label="Increase AI strength">+</button>
      </div>
      <button type="button" class="pass" id="pass-btn" disabled>Pass second move (P)</button>
      <p class="legend">Tzaar · Tzarra · Tott — stack height on top</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
