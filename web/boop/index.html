<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boop — Abstract Games</title>
  <style type="text/css">
    html, body { margin: 0; height: 100%; background-color: #0d0d0d; }
    #container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    #boop-canvas { border: 0; outline: none; }
    #keybindings {
      position: fixed; bottom: 10px; right: 10px;
      color: hsl(0, 0%, 35%); font-family: monospace; font-size: 12px; line-height: 1.6;
    }
    #keybindings kbd {
      background-color: hsl(0, 0%, 18%); border: 1px solid hsl(0, 0%, 28%);
      border-radius: 3px; padding: 1px 5px; font-family: monospace;
    }
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: hsl(0, 0%, 35%); font-family: monospace; font-size: 16px;
    }
    .back { position: fixed; top: 10px; left: 10px; font-family: system-ui, sans-serif; font-size: 14px; }
    .back a { color: hsl(0, 0%, 55%); }
  </style>
</head>
<body>
  <div class="back"><a href="../">← Abstract Games</a></div>
  <div id="container"><canvas id="boop-canvas" tabindex="0"></canvas></div>
  <div id="loading">Loading</div>
  <div id="keybindings">
    <kbd>C</kbd> Kitten / Cat<br>
    <kbd>U</kbd> / <kbd>Ctrl+Z</kbd> Undo<br>
    <kbd>Ctrl+R</kbd> Reset<br>
    <kbd>PageDown</kbd> / <kbd>PageUp</kbd> AI depth
  </div>
  <script type="module">
    import init from './boop.js'
    init().then(() => {
      document.getElementById('loading').style.display = 'none';
    }).catch((error) => {
      if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
        throw error;
      }
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
