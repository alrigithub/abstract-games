<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tzaar — Abstract Games</title>
  <style type="text/css">
    html, body { margin: 0; height: 100%; background-color: hsl(0, 0%, 5%); }
    #container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    #tzaar-canvas { border: 0; outline: none; }
    #keybindings {
      position: fixed; bottom: 10px; right: 10px;
      color: hsl(0, 0%, 30%); font-family: monospace; font-size: 12px; line-height: 1.6;
    }
    #keybindings kbd {
      background-color: hsl(0, 0%, 15%); border: 1px solid hsl(0, 0%, 25%);
      border-radius: 3px; padding: 1px 5px; font-family: monospace;
    }
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: hsl(0, 0%, 30%); font-family: monospace; font-size: 16px;
    }
    .back { position: fixed; top: 10px; left: 10px; font-family: system-ui, sans-serif; font-size: 14px; }
    .back a { color: hsl(0, 0%, 55%); }
  </style>
</head>
<body>
  <div class="back"><a href="../">← Abstract Games</a></div>
  <div id="container"><canvas id="tzaar-canvas" tabindex="0"></canvas></div>
  <div id="loading">Loading</div>
  <div id="keybindings">
    Click stack, then destination · forced capture / stack<br>
    <kbd>P</kbd> Pass (optional 2nd move)<br>
    <kbd>U</kbd> / <kbd>Ctrl+Z</kbd> Undo<br>
    <kbd>Ctrl+R</kbd> Reset<br>
    <kbd>PageDown</kbd> / <kbd>PageUp</kbd> AI depth
  </div>
  <script type="module">
    import init from './tzaar.js'
    const canvas = document.getElementById('tzaar-canvas');
    const focusCanvas = () => { try { canvas.focus({ preventScroll: true }); } catch (_) { canvas.focus(); } };
    canvas.addEventListener('pointerdown', focusCanvas);
    init().then(() => {
      document.getElementById('loading').style.display = 'none';
      focusCanvas();
    }).catch((error) => {
      if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
        throw error;
      }
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
